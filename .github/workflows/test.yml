name: Backend tests

# Runs the node:test suite on every PR and on pushes to feature branches.
# Separate from main_bayaryuk.yml (the Azure deploy) so tests gate merges
# without touching the deploy path. Activates once committed and pushed.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prisma generate only reads the schema (no DB connection needed); the
      # test suite imports the generated client.
      - name: Generate Prisma clients
        run: npm run generate_prisma

      - name: Run tests
        run: npm test
